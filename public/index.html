<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIRI AI PRO MAX 2026 | SPIHER CSE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
    body { font-family: 'Space Grotesk', sans-serif; background: #0a0a0f; overflow-x: hidden; }
    .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
    .neon { box-shadow: 0 0 20px #00ff88, 0 0 40px #00ff88, inset 0 0 10px rgba(0,255,136,0.2); }
    .gradient-text { background: linear-gradient(90deg, #00ff88, #00aaff, #ff00ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-size: 200% auto; animation: shine 3s linear infinite; }
    @keyframes shine { to { background-position: 200% center; } }
    @keyframes float { 0%,100% {transform: translateY(0)} 50% {transform: translateY(-15px)} }
    .float { animation: float 4s ease-in-out infinite; }
    .msg-user { background: linear-gradient(135deg, #00ff88, #00aaff); }
    .typing span { animation: blink 1.4s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 60%, 100% { opacity: 0.2; } 30% { opacity: 1; } }
  </style>
</head>
<body class="text-white min-h-screen">
  <div class="fixed inset-0 -z-10">
    <div class="absolute top-20 left-20 w-96 h-96 bg-green-500 rounded-full mix-blend-screen filter blur-3xl opacity-20 animate-pulse"></div>
    <div class="absolute bottom-20 right-20 w-96 h-96 bg-blue-500 rounded-full mix-blend-screen filter blur-3xl opacity-20 animate-pulse" style="animation-delay: 1s;"></div>
    <div class="absolute top-1/2 left-1/2 w-96 h-96 bg-purple-500 rounded-full mix-blend-screen filter blur-3xl opacity-10 animate-pulse" style="animation-delay: 2s;"></div>
  </div>

  <div class="max-w-5xl mx-auto p-4 h-screen flex flex-col">
    <header class="text-center py-8">
      <h1 class="text-6xl font-bold gradient-text float mb-2">GIRI AI PRO MAX 2026</h1>
      <p class="text-gray-400 text-lg">SPIHER CSE Department | Powered by Gemini 1.5 Flash</p>
    </header>

    <div id="chat" class="glass rounded-3xl p-6 flex-1 overflow-y-auto mb-6 space-y-4"></div>

    <div class="glass rounded-3xl p-4 flex gap-3 neon">
      <input id="input" type="text" placeholder="Enna da venum bro? Kelunga 🔥💚" 
        class="flex-1 bg-transparent outline-none text-lg placeholder-gray-500 px-4">
      <button onclick="sendMsg()" class="msg-user px-10 py-4 rounded-2xl font-bold hover:scale-105 transition-all duration-300">
        SEND ⚡
      </button>
    </div>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    
    function addMsg(text, user) {
      const div = document.createElement('div');
      div.className = user ? 'text-right' : 'text-left';
      div.innerHTML = `<div class="inline-block ${user ? 'msg-user' : 'glass'} px-6 py-4 rounded-2xl max-w-2xl text-left">${text}</div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }
    
    function addTyping() {
      const div = document.createElement('div');
      div.id = 'typing';
      div.className = 'text-left';
      div.innerHTML = `<div class="inline-block glass px-6 py-4 rounded-2xl typing"><span>.</span><span>.</span><span>.</span></div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }
    
    async function sendMsg() {
      const msg = input.value.trim();
      if (!msg) return;
      addMsg(msg, true);
      input.value = '';
      addTyping();
      
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message: msg})
        });
        const data = await res.json();
        document.getElementById('typing').remove();
        addMsg(data.reply || data.error, false);
      } catch {
        document.getElementById('typing').remove();
        addMsg('Network lag da bro! Refresh pannu 🔄', false);
      }
    }
    
    input.addEventListener('keypress', e => e.key === 'Enter' && sendMsg());
    addMsg('Vanakkam da thalaiva! 🔥💚 Naan GIRI AI PRO MAX 2026. SPIHER CSE pathi enna doubt naalum kelu. Fees, staff, placement ellam solluven da!', false);
  </script>
</body>
</html>
